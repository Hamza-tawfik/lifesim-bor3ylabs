<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Life Sim</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<script>try{var d=document.documentElement,c=JSON.parse(localStorage.getItem('lifesim-settings')||'{}');d.setAttribute('data-theme',localStorage.getItem('lifesim-theme2')||'terra');d.setAttribute('data-size',c.size||'m');d.setAttribute('data-compact',c.compact?'1':'0');d.setAttribute('data-still',c.still?'1':'0');d.setAttribute('data-tips',c.tips===0?'0':'1');d.setAttribute('data-quick',c.quick===0?'0':'1')}catch(e){document.documentElement.setAttribute('data-theme','terra')}</script>
<style>
:root{--bg:#1b2766;--card:#2f45a3;--ink:#ffffff;--mut:#cdd8ff;--acc:#f2b01e;--line:#7f95ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#12111f;--card:#1c1a31;--ink:#ece9ff;--mut:#9a97c0;--acc:#6e63f0;--line:#2f2c4d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:500 16px/1.45 Nunito,'Trebuchet MS',system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:30px;font-weight:900;margin:8px 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.age{font-size:76px;font-weight:900;line-height:.85;letter-spacing:-3px}
.money{font-size:22px;font-weight:900;text-align:right}
.life{height:6px;border-radius:3px;background:var(--line);margin:14px 0 10px;overflow:hidden}
.life b{display:block;height:100%;background:var(--acc)}
.bar{display:grid;grid-template-columns:150px 1fr 28px;align-items:center;gap:8px;font-size:14px;margin:7px 0}
.bar i{position:relative;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar b{display:block;height:100%;border-radius:5px;background:var(--c);transition:width .4s}
.bar em{font-style:normal;color:var(--mut);text-align:right}
.bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.75}
.lab{font-weight:700;font-size:14px;color:var(--mut);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:700 15px Nunito,'Trebuchet MS',system-ui,sans-serif;cursor:pointer;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.go{background:var(--acc);border-color:var(--acc);color:#fff;width:100%;padding:15px;font-size:18px;margin-bottom:12px;border-radius:16px}
ul{list-style:none;padding:0;margin:0}
li{padding:9px 0;border-top:1px solid var(--line);font-size:15px}
li:first-child{border:0;padding-top:0}
li b{color:var(--acc);margin-right:8px}
input,select{width:100%;box-sizing:border-box;padding:13px;margin-bottom:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:500 16px Nunito,system-ui,sans-serif}
.ov{position:fixed;inset:0;z-index:100;overscroll-behavior:contain;background:rgba(10,8,30,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--card);border-radius:22px;padding:20px;max-width:520px;width:100%;max-height:85vh;max-height:85dvh;overflow:auto;overscroll-behavior:contain}
.sheet p{font-size:19px;font-weight:700;margin:0 0 6px}
.sheet button{display:block;width:100%;margin-top:10px;border-radius:14px;padding:13px}

.hc{display:flex;gap:14px;border-radius:18px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden;color:#fff;background:linear-gradient(145deg,var(--c1),var(--c2) 58%,var(--c3));border:2px solid var(--rc);box-shadow:0 8px 22px rgba(0,0,0,.3),0 0 18px var(--rg),inset 0 0 26px rgba(255,255,255,.14)}
.hc::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.16) 50%,transparent 62%);pointer-events:none}
.hx{display:flex;flex-direction:column;align-items:center;min-width:84px;gap:2px;position:relative}
.cr{width:76px;height:84px;display:flex;align-items:center;justify-content:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,#fff,var(--rc));position:relative}
.cr::before{content:'';position:absolute;inset:4px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--c1),rgba(8,6,20,.88))}
.cr b{position:relative;font-size:32px;font-weight:900;color:#fff;line-height:1;text-shadow:0 0 10px var(--rc)}
.lv{font-size:10px;font-weight:900;letter-spacing:.2em;color:rgba(255,255,255,.85);margin-top:2px}
.rk{font-size:11px;font-weight:900;letter-spacing:.06em;color:#12101f;background:var(--rc);border-radius:999px;padding:2px 9px;text-transform:uppercase}
.pips{display:flex;gap:4px;margin-top:8px}
.pips i{width:7px;height:7px;transform:rotate(45deg);background:rgba(0,0,0,.35)}
.pips i.on{background:#fff;box-shadow:0 0 6px var(--rc)}
.hr{flex:1;min-width:0;position:relative}
.hn{font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.hn small{font-size:15px}
.hl{font-size:12px;color:rgba(255,255,255,.85);font-weight:700;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;background:rgba(0,0,0,.28);border-radius:12px;padding:8px}
.ha{display:grid;grid-template-columns:44px 1fr 22px;gap:5px;align-items:center;font-size:10px;font-weight:800;color:rgba(255,255,255,.9)}
.ha i{height:8px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden}
.ha b{display:block;height:100%;border-radius:4px}
.ha em{font-style:normal;color:#fff;text-align:right;font-size:11px}
.hc .fq{color:rgba(255,255,255,.9);margin-top:8px;opacity:1}
.fq{font-size:11px;font-weight:800;margin-top:8px;opacity:.85;letter-spacing:.04em}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;gap:8px;overflow-x:auto;padding:8px 2px 10px;margin:0 -2px 6px;background:var(--bg);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:66px;padding:8px 10px 6px;border-radius:16px;border:2px solid var(--line);background:var(--card);color:var(--ink);position:relative}
.tab span{font-size:22px;line-height:1}
.tab em{font-style:normal;font-size:11px;font-weight:800}
.tab.on{background:var(--tc);border-color:var(--tc);color:#fff;transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.tab.lk{opacity:.55}
.bd{position:absolute;top:-5px;right:-3px;background:#ef4444;color:#fff;border-radius:999px;font-style:normal;font-size:11px;font-weight:900;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 4px}
.tb{border-radius:20px;padding:16px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,var(--tc),#1d1b3a)}
.tt{font-size:24px;font-weight:900}
.td{opacity:.9;font-size:14px;margin-top:2px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;font-size:15px}
.pc small{display:block;color:var(--mut);margin-top:4px;font-size:13px}
.acs{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
.ac{display:flex;gap:12px;align-items:center;text-align:left;border-radius:16px;padding:12px 14px;border:2px solid var(--line);background:var(--card);border-left:6px solid var(--tc)}
.ac .ai{font-size:28px}
.ac b{display:block;font-size:16px}
.ac small{display:block;color:var(--mut);font-weight:500;font-size:13px}
.dock{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:6;margin-top:8px}
.tick{font-size:12px;color:var(--mut);text-align:center;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--bg);border-radius:10px;padding:2px 6px}
.dock .go{margin:0;display:flex;justify-content:center;align-items:center;gap:10px;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.dots{letter-spacing:3px;font-size:14px}
@media(min-width:520px){.acs{grid-template-columns:1fr 1fr}}

.tab{min-width:76px;gap:1px}
.tab small{font-size:10px;font-weight:700;opacity:.75;max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab.on small{opacity:.95}
.tab.on span{animation:bop .5s ease}
@keyframes bop{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade{animation:fd .28s ease}
.tp{margin-top:10px;background:rgba(255,255,255,.16);border-radius:12px;padding:6px 10px;font-size:13px}
.sec{margin-bottom:14px}
.sh{font-weight:900;font-size:15px;margin:4px 2px 8px}
.em{display:block;color:var(--mut);font-size:13px;margin:0 4px 10px}
.ac .at{flex:1;min-width:0}
.ac:active:not(:disabled){transform:scale(.98)}
.pill{font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px;background:var(--line);color:var(--mut);white-space:nowrap}
.pill.fr{background:#16a34a;color:#fff}
.tro{display:flex;gap:12px;margin-top:8px}
.tro span{opacity:.3;font-size:22px;display:flex;align-items:center;gap:4px}
.tro span.on{opacity:1}
.tro i{font-style:normal;font-size:12px;font-weight:800}
@media(prefers-reduced-motion:reduce){.fade,.tab.on span{animation:none}}
.th .sw{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.swb{width:44px;height:44px;border-radius:50%;padding:0;border:3px solid var(--line);background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.swb.on{border-color:var(--ink);transform:scale(1.1)}

.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.stt b{display:block;font-size:15px}
.stt small{color:var(--mut);font-size:13px}
.sg{display:flex;gap:8px;flex-wrap:wrap}
.sg button{flex:1;min-width:56px;padding:9px 12px;border-radius:12px}
.sg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.nm{display:flex;gap:8px}
.nm input{margin:0;flex:1}
:root[data-tips="0"] .tp{display:none}
:root[data-quick="0"] .qk{display:none}
:root[data-compact="1"] .card,:root[data-compact="1"] .pc,:root[data-compact="1"] .hc,:root[data-compact="1"] .st{padding:10px;margin-bottom:8px}
:root[data-compact="1"] .acs{gap:6px;margin-bottom:8px}
:root[data-compact="1"] .ac{padding:8px 10px}
:root[data-compact="1"] .sec{margin-bottom:8px}
:root[data-still="1"] *,:root[data-still="1"] *::before,:root[data-still="1"] *::after{animation:none!important;transition:none!important}
:root[data-size="s"] #app>*:not(.ov){zoom:.9}
:root[data-size="l"] #app>*:not(.ov){zoom:1.12}
:root[data-size="xl"] #app>*:not(.ov){zoom:1.25}
:root[data-size="s"] .sheet{zoom:.9;max-height:calc(85vh/.9);max-height:calc(85dvh/.9)}
:root[data-size="l"] .sheet{zoom:1.12;max-height:calc(85vh/1.12);max-height:calc(85dvh/1.12)}
:root[data-size="xl"] .sheet{zoom:1.25;max-height:calc(85vh/1.25);max-height:calc(85dvh/1.25)}
.ml{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:800;margin:6px 4px 0 0}
.ml.p{background:#bbf7d0;color:#14532d}
.ml.n{background:#fecaca;color:#7f1d1d}
.tcs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tch{padding:7px 10px;border-radius:999px;font-size:13px;font-weight:800}
.tch.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg2{display:flex;gap:4px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px;margin-bottom:12px}
.seg2 button{flex:1;min-height:48px;border-radius:12px;border:0;background:transparent;font-weight:900;font-size:15px}
.seg2 button.on{background:var(--ink);color:var(--card)}
.gp,.sk{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.gp{display:flex;flex-direction:column;gap:8px}
.gh,.r,.r2,.trw{display:flex;justify-content:space-between;align-items:center;gap:8px}
.r2{justify-content:flex-start;gap:12px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.at2{text-align:left;min-height:84px;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;border:2px solid var(--line)}
.at2 small,.nt small,.sk small{color:var(--mut);font-weight:500;font-size:12px}
.bar2{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar2 b{display:block;height:100%}
.mc{display:flex;flex-direction:column;gap:10px}
.mcirc{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;background:#dcfce7;color:#14532d}
.care{width:100%;min-height:56px;border-radius:16px;border:0;background:#0b7a6e;color:#fff;font-weight:900;font-size:17px;margin-bottom:12px}
.nts{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
.nt{text-align:left;min-height:136px;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;border:2px solid var(--line)}
.nt .big{font-size:32px;font-weight:900}
.nt .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.nb{min-height:52px;border-radius:12px;border:2px solid var(--line);background:transparent;color:inherit;font-family:inherit;font-size:14px;padding:6px;line-height:1.25}
.nb b{display:block;font-weight:900}.nb span{display:block;font-size:12px;font-weight:600}
.nb.t{background:#0b7a6e;border-color:#0b7a6e;color:#fff}
.nb:disabled{opacity:.45}
.jart{width:100%;height:auto;display:block;border:3px solid #1f2937;border-radius:12px;margin-bottom:8px}
:root:root .jart{border-radius:0;border-color:var(--dk)}
.lad{display:grid;gap:4px;margin:8px 0}.lad div{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;background:rgba(127,127,127,.14);font-size:14px}.lad .now{font-weight:900;outline:2px solid #f59e0b}.lad .past{opacity:.6}
:root:root .nb{border:3px solid var(--dk);border-radius:0;background:var(--bh);color:var(--bx);box-shadow:0 3px 0 var(--dk)}
:root:root .nb.t{background:#2a7e23;color:#fff}
.nt.crit{border:3px solid #991b1b}
.nt.done{border-style:dashed}
.st-Great{background:#bbf7d0;color:#14532d}
.st-Good{background:#dcfce7;color:#14532d}
.st-OK{background:#fef3c7;color:#3a2a00}
.st-Low{background:#fed7aa;color:#7c2d12}
.st-Critical{background:#991b1b;color:#fff}
.lvp{background:#ede9fe;color:#4c1d95}
.sk{display:flex;gap:12px;align-items:center}
.bd2{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.sk .pr{flex:0 0 auto;min-height:48px;padding:0 14px;border-radius:14px;border:2px solid var(--acc);background:var(--card);color:var(--acc);font-weight:900}
.trw{margin-top:8px;font-size:13px;align-items:flex-start}
.trw span{color:var(--mut);text-align:right}


.ttl{position:relative;margin-bottom:16px}
.tch .ti{font-style:normal;margin-right:4px}
:root{--dk:#0a1138;--bgt:#26398f;--bg2:#162057;--bt:#3a4b99;--bh:#7f95ee;--bs:#1e2a6e;--bx:#ffffff;--acb:#f2b01e;--ac2:#ffd76a;--ac3:#b87b00;--on:#2b1b00;--hd:#ffd23f;--inp:#0e1650;--tk:#0e1650;--sh2:#243a8c;--star:1;--ts:rgba(0,0,0,.4);--crit:#ff5a4d;--pf:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;--pxf:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif}
:root:root body{font-family:var(--pxf);font-weight:500;background:linear-gradient(var(--bgt),var(--bg2)) fixed}
:root:root body::before{content:'';position:fixed;left:0;top:0;width:2px;height:2px;background:#fff;opacity:var(--star);box-shadow:930px 890px #ffd23f,929px 524px #fff,382px 827px #ffd23f,1293px 632px #fff,196px 461px #cdd8ff,294px 96px #fff,1223px 409px #ffd23f,1343px 760px #fff,1280px 19px #fff,125px 40px #fff,499px 618px #fff,954px 338px #ffd23f,1214px 866px #fff,1067px 243px #cdd8ff,1027px 8px #fff,940px 674px #cdd8ff,837px 568px #fff,524px 326px #fff,1054px 299px #fff,147px 580px #fff,824px 114px #cdd8ff,795px 72px #fff,5px 222px #fff,111px 485px #ffd23f,817px 433px #fff,1163px 648px #fff,1386px 280px #cdd8ff,182px 322px #cdd8ff,35px 423px #fff,279px 256px #fff,26px 65px #ffd23f,1001px 185px #fff,920px 525px #fff,272px 433px #ffd23f,242px 408px #ffd23f,439px 4px #cdd8ff,1217px 315px #fff,435px 195px #ffd23f,1236px 661px #fff,90px 153px #fff,908px 268px #fff,1253px 340px #cdd8ff,794px 79px #fff,188px 217px #fff,35px 619px #cdd8ff,765px 641px #ffd23f,264px 605px #ffd23f,1180px 142px #ffd23f,378px 646px #fff,640px 237px #fff,392px 166px #fff,799px 498px #fff,867px 52px #fff,227px 43px #cdd8ff,492px 761px #ffd23f,530px 434px #ffd23f,604px 536px #fff,144px 133px #fff,985px 576px #fff,577px 221px #fff,37px 74px #cdd8ff,846px 460px #fff,127px 51px #fff,581px 381px #fff,192px 374px #fff,926px 342px #fff,1212px 39px #fff,976px 370px #cdd8ff,72px 25px #fff,991px 72px #cdd8ff;z-index:-1;pointer-events:none}
:root:root button,:root:root input,:root:root select{font-family:var(--pxf)}
:root:root h1{font-family:var(--pf);font-size:22px;line-height:1.4;text-shadow:3px 3px 0 var(--dk)}
:root:root :is(.card,.pc,.gp,.sk,.th){border:4px solid var(--dk);border-radius:0;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 4px 0 var(--dk)}
:root:root button{border:4px solid var(--dk);border-radius:0;background:var(--bt);color:var(--bx);font-weight:700;box-shadow:inset -4px -4px 0 var(--bs),inset 4px 4px 0 var(--bh),0 4px 0 var(--dk);text-shadow:1px 1px 0 var(--ts)}
:root:root :is(.ac,.nt,.at2){border:4px solid var(--dk);border-radius:0;background:var(--bt);color:var(--bx);box-shadow:inset 0 0 0 2px var(--bh),0 4px 0 var(--dk)}
:root:root :is(.ac,.nt,.at2):hover:not(:disabled){border-color:var(--acb)}
:root:root .nt.crit{border-color:var(--crit)}
:root:root .nt.done{border-style:dashed}
:root:root input,:root:root select{border:4px solid var(--dk);border-radius:0;background:var(--inp);color:var(--ink);box-shadow:inset 0 0 0 2px var(--bt);font-size:16px}
:root:root input::placeholder{color:var(--mut)}
:root:root .seg2{border:4px solid var(--dk);border-radius:0;background:var(--tk);gap:6px}
:root:root .seg2 button{background:var(--bt)}
:root:root .seg2 button.on,:root:root :is(.sb,.tch).on{background:var(--acb);color:var(--on);text-shadow:none;box-shadow:inset -4px -4px 0 var(--ac3),inset 4px 4px 0 var(--ac2),0 4px 0 var(--dk)}
:root:root .sk .pr{background:var(--bt);color:var(--hd);border:4px solid var(--dk);box-shadow:inset 0 0 0 2px var(--bh),0 4px 0 var(--dk)}
:root:root .swb{border-radius:0;background:linear-gradient(135deg,var(--a) 50%,var(--b) 50%);box-shadow:0 4px 0 var(--dk);color:#fff}

/* celebration pop-ups */
#cel{position:fixed;inset:0;z-index:300;pointer-events:none;display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 84px) 12px 0}
#cel .cbk{position:absolute;inset:0;background:rgba(0,0,0,0);transition:background .3s ease;pointer-events:none}
#cel.big{align-items:center;padding-top:0}#cel.big.on .cbk{background:rgba(0,0,0,.5);pointer-events:auto;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#cel .cp{position:relative;pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:min(92vw,420px);padding:12px 18px 12px 14px;border-radius:18px;background:var(--card);color:var(--ink);border:3px solid var(--cc);box-shadow:0 12px 32px rgba(0,0,0,.5),0 0 0 5px color-mix(in srgb,var(--cc) 30%,transparent),0 0 28px color-mix(in srgb,var(--cc) 55%,transparent);opacity:0;transform:translateY(-130%) scale(.85)}
#cel.on .cp{animation:cin .6s cubic-bezier(.2,1.7,.4,1) forwards}#cel.out .cp{animation:cout .28s ease-in forwards}
#cel .ci{font-size:36px;line-height:1;flex:none;animation:cwob 1s ease .25s}
#cel .ct{min-width:0}#cel .ct b{display:block;font-size:19px;font-weight:900;line-height:1.2}#cel .ct small{display:block;font-size:13px;opacity:.85;margin-top:2px}
#cel .cp::after{content:"";position:absolute;inset:0;border-radius:15px;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:cshine 1.1s ease .4s forwards;pointer-events:none}
#cel.big .cp{flex-direction:column;text-align:center;padding:26px 30px;gap:8px;transform:scale(.4) rotate(-6deg)}
#cel.big.on .cp{animation:cbig .75s cubic-bezier(.2,1.6,.4,1) forwards}#cel.big .ci{font-size:76px;animation:cspin 1s cubic-bezier(.3,1.5,.5,1)}#cel.big .ct b{font-size:26px}
#cel .cfx{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
#cel .cfx i{position:absolute;left:0;top:0;width:8px;height:12px;background:var(--c);border-radius:2px;opacity:0;animation:cconf 1.3s ease-out var(--d) forwards}
@keyframes cin{0%{opacity:0;transform:translateY(-130%) scale(.85)}100%{opacity:1;transform:none}}
@keyframes cout{to{opacity:0;transform:translateY(-40px) scale(.95)}}
@keyframes cbig{0%{opacity:0;transform:scale(.4) rotate(-6deg)}100%{opacity:1;transform:none}}
@keyframes cspin{0%{transform:scale(0) rotate(-200deg)}100%{transform:none}}
@keyframes cwob{0%,100%{transform:none}25%{transform:rotate(-14deg) scale(1.15)}60%{transform:rotate(10deg) scale(1.1)}}
@keyframes cshine{to{transform:translateX(120%)}}
@keyframes cconf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 80px)) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){#cel .cp,#cel .cp::after,#cel .ci{animation-duration:.01s!important}}
html[data-still="1"] #cel .cfx,html[data-still="1"] #cel .cp::after{display:none}

/* pets */
.pcg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.pcg .mkb{min-width:0;padding:6px 4px;font-size:12px}
